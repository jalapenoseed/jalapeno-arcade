// src/net.ts
var DEFAULT_SERVER = "wss://jalapenoseed-dq25d.fly.dev/ws";
function serverUrl() {
  const q = new URLSearchParams(location.search);
  if (q.get("offline"))
    return null;
  const s = q.get("server");
  if (s)
    return s;
  if (location.protocol === "http:" || location.protocol === "https:") {
    const h = location.hostname;
    if (h.endsWith(".fly.dev") || h === "localhost" || h === "127.0.0.1")
      return (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws";
  }
  return DEFAULT_SERVER;
}

class Net {
  ws = null;
  url;
  id = 0;
  status = "off";
  inbox = [];
  sendT = 0;
  retry = 0;
  retryT = 0;
  hello = () => ({});
  constructor() {
    this.url = serverUrl();
  }
  connect() {
    if (!this.url || this.ws)
      return;
    this.status = "connecting";
    let ws;
    try {
      ws = new WebSocket(this.url);
    } catch {
      this.status = "offline";
      this.scheduleRetry();
      return;
    }
    this.ws = ws;
    ws.onopen = () => {
      this.retry = 0;
      this.raw({ t: "hello", ...this.hello() });
    };
    ws.onmessage = (e) => {
      let m;
      try {
        m = JSON.parse(e.data);
      } catch {
        return;
      }
      if (m.t === "welcome") {
        this.id = m.id;
        this.status = "online";
      }
      this.inbox.push(m);
    };
    ws.onclose = () => {
      this.ws = null;
      if (this.status === "online")
        this.inbox.push({ t: "disconnected" });
      this.status = "offline";
      this.scheduleRetry();
    };
    ws.onerror = () => {};
  }
  scheduleRetry() {
    this.retryT = Math.min(30, 2 + this.retry * 3);
    this.retry++;
  }
  update(dt, state) {
    if (!this.url)
      return;
    if (!this.ws && this.status !== "connecting") {
      this.retryT -= dt;
      if (this.retryT <= 0)
        this.connect();
      return;
    }
    if (this.status !== "online")
      return;
    this.sendT -= dt;
    if (this.sendT <= 0) {
      this.sendT = 0.1;
      this.raw({ t: "state", ...state() });
    }
  }
  raw(m) {
    if (this.ws && this.ws.readyState === 1)
      this.ws.send(JSON.stringify(m));
  }
  get online() {
    return this.status === "online";
  }
}

var rng2 = new RNG(4242);

class FX {
  parts = [];
  nums = [];
  popups = [];
  flashT = 0;
  flashCol = UI.white;
  hitStop = 0;
  spawn(x, y, z, vx, vy, vz, life, mat, size = 0.08, grav = -9, drag = 0.98, glow = false, floor = -99) {
    if (this.parts.length > 900)
      this.parts.shift();
    this.parts.push({ x, y, z, vx, vy, vz, life, max: life, ramp: RAMPS[mat], size, grav, drag, glow, floor });
  }
  burst(x, y, z, n, mat, speed, up = 2, life = 0.6, size = 0.08, grav = -9, floor = -99) {
    for (let i = 0;i < n; i++) {
      const a = rng2.range(0, Math.PI * 2), s = rng2.range(0.3, 1) * speed;
      this.spawn(x, y, z, Math.cos(a) * s, rng2.range(0.2, 1) * up, Math.sin(a) * s, life * rng2.range(0.6, 1.2), mat, size * rng2.range(0.7, 1.3), grav, 0.97, false, floor);
    }
  }
  hitSpark(x, y, z, crit) {
    this.burst(x, y, z, crit ? 34 : 16, M.GOLD, crit ? 6 : 4, 3, 0.45, 0.07, -6);
    this.burst(x, y, z, crit ? 10 : 5, M.FIRE, 3, 2, 0.35, 0.1, -4);
    if (crit)
      this.burst(x, y, z, 8, M.CLOUD, 7, 3, 0.25, 0.06, 0);
  }
  dust(x, y, z, n = 4) {
    this.burst(x, y + 0.05, z, n, M.DIRT, 1.2, 0.8, 0.45, 0.07, -2, y);
  }
  splash(x, y, z) {
    this.burst(x, y, z, 18, M.WATER, 2, 4, 0.6, 0.07, -12, y - 0.1);
  }
  sparkle(x, y, z, mat = M.GOLD, n = 12) {
    for (let i = 0;i < n; i++)
      this.spawn(x + rng2.range(-0.4, 0.4), y + rng2.range(0, 1.2), z + rng2.range(-0.4, 0.4), 0, rng2.range(0.5, 1.6), 0, rng2.range(0.5, 1.1), mat, 0.06, 0, 0.95, true);
  }
  heal(x, y, z) {
    for (let i = 0;i < 30; i++) {
      const a = i / 30 * Math.PI * 4, r = 0.5;
      this.spawn(x + Math.cos(a) * r, y + i * 0.05, z + Math.sin(a) * r, -Math.sin(a) * 0.6, 1.4, Math.cos(a) * 0.6, 0.9, i % 2 ? M.LIME : M.TEAL, 0.07, 0, 0.98, true);
    }
  }
  ring(x, y, z, mat, n = 24, speed = 4) {

      const k = p.t / p.dur;
      const y = Math.round(r.H * p.y - (k < 0.15 ? (0.15 - k) * 60 : 0) - k * 6);
      if (k > 0.85 && Math.floor(p.t * 30) % 2)
        continue;
      trickText(r, p.text, r.W / 2, y, p.top, p.bottom, UI.black, p.scale, 0.35, "c", 1, this.time);
    }
    for (const n of this.fx.nums) {
      const pr = r.project(n.x, n.y, n.z);
      if (!pr)
        continue;
      const bounce = n.t < 0.3 ? -Math.sin(n.t / 0.3 * Math.PI) * 10 : n.t < 0.45 ? -Math.sin((n.t - 0.3) / 0.15 * Math.PI) * 3 : 0;
      if (n.t > 0.9 && Math.floor(n.t * 30) % 2)
        continue;
      if (n.big)
        trickText(r, n.text, pr[0], pr[1] + bounce - 8, n.col, n.col, UI.black, 1, 0.2, "c");
      else
        textC(r, n.text, pr[0], pr[1] + bounce - 6, n.col, UI.black);
    }
    if (this.showFps)
      text(r, Math.round(1000 / Math.max(1, this.perf.ms)) + " FPS-CAP  " + this.perf.ms.toFixed(1) + "MS", 4, r.H - 26, UI.white, UI.black);
  }
  showFps = false;
  drawTouch(r) {
    const inp = this.input;
    inp.layoutTouch(r.W, r.H);
    const circle = (x, y, rad, col, amt) => {
      for (let yy = -rad;yy <= rad; yy++)
        for (let xx = -rad;xx <= rad; xx++) {
          const d = Math.hypot(xx, yy);
          const px = Math.round(x + xx), py = Math.round(y + yy);
          if (px < 0 || py < 0 || px >= r.W || py >= r.H)
            continue;
          if (d <= rad && d > rad - 1.5)
            r.color[py * r.W + px] = UI.white;
          else if (d < rad && BAYER4[(py & 3) * 4 + (px & 3)] < amt)
            r.color[py * r.W + px] = col;
        }
    };
    for (const b of inp.touchBtns) {
      circle(b.x, b.y, Math.round(b.r), inp.held(b.id) ? UI.yellow : UI.win, 0.55);
      textC(r, b.label, b.x, b.y - 3, UI.white, UI.black);
    }
    if (inp.stick) {
      circle(inp.stick.ox, inp.stick.oy, Math.round(Math.min(r.W, r.H) * 0.09), UI.win, 0.3);
      circle(inp.stick.x, inp.stick.y, Math.round(Math.min(r.W, r.H) * 0.035), UI.white, 0.6);
    }
  }
  renderBoot() {
    const r = this.r;
    r.color.fill(UI.black);
    centerText(r, "DRIFTER'S QUEST 2.5D", r.H / 2 - 20, UI.grey);
    if (Math.floor(this.time * 2) % 2 === 0)
      centerText(r, "▶ PRESS ANY KEY / TAP", r.H / 2, UI.white);
    centerText(r, "SOUND ON", r.H / 2 + 16, UI.dim);
    r.present();
  }
  stage(eye, tgt, fov) {
    const r = this.r;
    for (let y = 0;y < r.H; y++) {
      const k = y / r.H;
      for (let x = 0;x < r.W; x++)
        r.color[y * r.W + x] = BAYER4[(y & 3) * 4 + (x & 3)] < k * 0.8 ? RAMPS[M.INK][2] : RAMPS[M.INK][1];
    }
    r.depth.fill(0);
    r.setCamera([eye[0] - 500, eye[1], eye[2] - 500], [tgt[0] - 500, tgt[1], tgt[2] - 500], 0, fov);
    r.fogStart = 999;
    r.fogEnd = 1000;
  }
  renderIdent() {
    const r = this.r, t = this.stateT;
    this.stage([0, 2.2, 9.5], [0, 0.55, 0], 34);
    const pop = clamp(t / 0.5, 0, 1);
    const ease = 1 - Math.pow(1 - pop, 3) * Math.cos(pop * 6);
    r.near = 0.1;
    const m = this.jalapeno, a = t * 2.2;
    r.splats(m.pos, m.col, m.count, m.vs * ease, -500, 0.15 + Math.sin(t * 3) * 0.06, -500, Math.cos(a), Math.sin(a));
    r.near = 0.15;
    for (let i = 0;i < 18; i++) {
      const aa = i / 18 * TAU + t * 0.8, rr = 1.2 + Math.sin(t * 2 + i) * 0.1;
      if (t > 0.4)
        r.point(-500 + Math.cos(aa) * rr, 1.2 + Math.sin(aa * 2 + t) * 0.5, -500 + Math.sin(aa) * rr * 0.5, 0.05, i % 3 ? UI.yellow : UI.red);
    }
    const ty = Math.round(r.H * 0.68);
    if (t > 0.6)
      trickText(r, "JALAPEÑO SEED", r.W / 2, ty, UI.lime, UI.green, UI.black, 2, 0.3, "c", t < 1 ? 2 : 0, t);
    if (t > 0.9)
      trickText(r, "PRODUCTIONS", r.W / 2, ty + 20, UI.red, UI.orange, UI.black, 2, 0.3, "c");
    if (t > 1.5)
      centerText(r, "PRESENTS", ty + 42, UI.grey);
    if (t > 3.1)
      dither(r, 0, 0, r.W, r.H, UI.black, (t - 3.1) / 0.5);
    r.present();
  }
  renderTitleUI() {
    const r = this.r, t = this.time;
    dither(r, 0, 0, r.W, 64, UI.navy, 0.35);
    trickText(r, "DRIFTER'S", r.W / 2, 12, UI.white, UI.cyan, UI.black, 2, 0.35, "c");
    trickText(r, "QUEST", r.W / 2, 28, UI.yellow, UI.orange, UI.black, 4, 0.35, "c", 1, t);
    trickText(r, "2.5D", r.W / 2 + 70, 46, UI.pink, UI.red, UI.black, 1, 0.3, "l");
    const opts = this.titleOpts();
    const ww = 150, hh = 10 + opts.length * 12, wx = (r.W - ww) / 2, wy = r.H - 22 - hh;
    win(r, wx, wy, ww, hh);
    opts.forEach((o, i) => {
      text(r, o, wx + 26, wy + 7 + i * 12, UI.white);
      if (i === this.titleIdx)
        hand(r, wx + 12, wy + 6 + i * 12, t);
    });
    text(r, "A JALAPEÑO SEED PRODUCTIONS GAME", 4, r.H - 9, UI.grey, UI.black);
    if (this.best > 0) {
      const s = "BEST " + fmtNum(this.best);
      text(r, s, r.W - textWidth(s) - 4, r.H - 9, UI.yellow, UI.black);
    }
    if (this.showHelp)
      this.drawHelp();
  }
  drawHelp() {
    const r = this.r;
    const lines = [
      "MOVE ......... WASD / ARROWS / LEFT STICK",
      "JUMP / TALK .. SPACE / ENTER / Z / A",
      "DASH ......... SHIFT     CHAT .. T",
      "CAMERA ....... C (OR 1 2 3)  Q/E ROTATE",
      "PACK/QUESTS .. TAB       SOUND . M",
      "",
      "BATTLE: PICK FIGHT, THEN PRESS A WHEN THE",
      "CURSOR HITS THE GOLD ZONE. KEEP HITTING",
      "PERFECTS TO CHAIN UP TO 4 STRIKES.",
      "ON ENEMY TURNS PRESS A IN THE BLUE ZONE",
      "TO PARRY. FILL THE SPECIAL METER FOR",
      "DRIFTER'S FURY.  JUMP LEDGES FOR COMBOS!"
    ];
    const ww = Math.min(r.W - 10, 268), hh = lines.length * 10 + 16, wx = (r.W - ww) / 2, wy = (r.H - hh) / 2;
    win(r, wx, wy, ww, hh);
    lines.forEach((l, i) => text(r, l, wx + 10, wy + 9 + i * 10, i >= 6 ? UI.grey : UI.white));
  }
}
function wrap(s, n) {
  const out = [];
  let line = "";
  for (const w of s.split(" ")) {
    if ((line + " " + w).trim().length > n) {
      out.push(line);
      line = w;
    } else
      line = (line + " " + w).trim();
  }
  if (line)
    out.push(line);
  return out;
}

// src/main.ts
var canvas = document.getElementById("c");
var r = new Renderer(canvas);
var input = new Input(canvas);
var game = new Game(r, input);
input.onFirstGesture = () => game.audio.init();
function fit() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cw = Math.floor(window.innerWidth * dpr), ch = Math.floor(window.innerHeight * dpr);
  canvas.width = cw;
  canvas.height = ch;
  const aspect = cw / ch;
  let w, h;
  if (aspect >= 1) {
    h = 216;
    w = Math.round(Math.min(512, Math.max(288, h * aspect)));
  } else {
    w = 256;
    h = Math.round(Math.min(480, Math.max(256, w / aspect)));
  }
  if (w !== r.W || h !== r.H)
    r.resize(w, h);
  input.toInternal = (x, y) => {
    const sc = Math.min(cw / r.W, ch / r.H);
    const dw = r.W * sc, dh = r.H * sc;
    return [(x * dpr - (cw - dw) / 2) / sc, (y * dpr - (ch - dh) / 2) / sc];
  };
}
window.addEventListener("resize", fit);
fit();
var q = new URLSearchParams(location.search);
if (q.get("fps"))
  game.showFps = true;
window.__game = game;
var last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  game.frame(dt);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
