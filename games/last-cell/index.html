            g = v;
            b = p;
            break;

            g = v;
            b = t;

            g = q;
            b = v;

            g = p;

"use strict";
// ============================================================
//  Custom software renderer: colour buffer, depth buffer, object-id
//  buffer (for cartoon outlines) and an emissive buffer for neon bloom.
// ============================================================
const SW = 384, SH = 216;
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => (v + 0.5) / 16);
const FAR = 1e9;

    constructor(canvas) {
        this.hw = SW >> 1;
        this.hh = SH >> 1;

        this.canvas = canvas;
        canvas.width = SW;
        canvas.height = SH;
        this.ctx = canvas.getContext('2d');
        this.img = this.ctx.createImageData(SW, SH);
        this.buf = new Uint32Array(this.img.data.buffer);
        const n = SW * SH, hn = this.hw * this.hh;
        this.zb = new Float32Array(n);
        this.id = new Uint16Array(n);
        this.gR = new Float32Array(n);
        this.gG = new Float32Array(n);
        this.gB = new Float32Array(n);
        this.hR = new Float32Array(hn);
        this.hG = new Float32Array(hn);
        this.hB = new Float32Array(hn);
        this.tR = new Float32Array(hn);
        this.tG = new Float32Array(hn);
        this.tB = new Float32Array(hn);
        this.scratch = new Uint32Array(n);

    begin() { this.zb.fill(FAR); this.id.fill(0); this.gR.fill(0); this.gG.fill(0); this.gB.fill(0); this.frame++; }

    glow(i, c, s) { this.gR[i] += cR(c) * s; this.gG[i] += cG(c) * s; this.gB[i] += cB(c) * s; }
    // ---------- 2D primitives (no depth) ----------
    px(x, y, c) { x |= 0; y |= 0; if (x >= 0 && y >= 0 && x < SW && y < SH)
        this.buf[y * SW + x] = c; }
    pxa(x, y, c, a) {
        x |= 0;
        y |= 0;
        if (x < 0 || y < 0 || x >= SW || y >= SH)
            return;

        this.buf[i] = mix(this.buf[i], c, a);
    }
    rect(x, y, w, h, c) {
        let x0 = Math.max(0, x | 0), y0 = Math.max(0, y | 0), x1 = Math.min(SW, (x + w) | 0), y1 = Math.min(SH, (y + h) | 0);
        for (let yy = y0; yy < y1; yy++)
            this.buf.fill(c, yy * SW + x0, yy * SW + x1);
    }
    rectA(x, y, w, h, c, a) {
        let x0 = Math.max(0, x | 0), y0 = Math.max(0, y | 0), x1 = Math.min(SW, (x + w) | 0), y1 = Math.min(SH, (y + h) | 0);

            for (let xx = x0; xx < x1; xx++) {

    }
    // dithered translucent rect (retro checker transparency)
    rectD(x, y, w, h, c, level) {
        let x0 = Math.max(0, x | 0), y0 = Math.max(0, y | 0), x1 = Math.min(SW, (x + w) | 0), y1 = Math.min(SH, (y + h) | 0);
        for (let yy = y0; yy < y1; yy++)
            for (let xx = x0; xx < x1; xx++)

                    this.buf[yy * SW + xx] = c;
    }
    frame2(x, y, w, h, c) { this.rect(x, y, w, 1, c); this.rect(x, y + h - 1, w, 1, c); this.rect(x, y, 1, h, c); this.rect(x + w - 1, y, 1, h, c); }
    circle(cx, cy, r, c) {
        const r2 = r * r;
        for (let y = -Math.ceil(r); y <= Math.ceil(r); y++)
            for (let x = -Math.ceil(r); x <= Math.ceil(r); x++)
                if (x * x + y * y <= r2)
                    this.px(cx + x, cy + y, c);
    }
    ring(cx, cy, r, th, c, glowS = 0) {
        const ro = r * r, ri = (r - th) * (r - th);
        for (let y = -Math.ceil(r); y <= Math.ceil(r); y++)
            for (let x = -Math.ceil(r); x <= Math.ceil(r); x++) {
                const d = x * x + y * y;
                if (d <= ro && d >= ri) {
                    const X = (cx + x) | 0, Y = (cy + y) | 0;
                    if (X < 0 || Y < 0 || X >= SW || Y >= SH)
                        continue;

                    if (glowS)
                        this.glow(Y * SW + X, c, glowS);

    line(x0, y0, x1, y1, c) {
        const dx = x1 - x0, dy = y1 - y0, n = Math.max(1, Math.ceil(Math.max(Math.abs(dx), Math.abs(dy))));

    // ---------- depth-tested billboards ----------

                if (z >= this.zb[i])

            this.discZ(x0 + dx * i / n, y0 + dy * i / n, z, th, c, glowS);

    // ---------- text ----------

        for (let r = 0; r < 7; r++) {
            const row = g[r];
            if (!row)
                continue;
            for (let b = 0; b < 5; b++)

                    if (sc === 1)
                        this.px(x + b, y + r, c);

    text(s, x, y, c, sc = 1, shadow = -1) {
        s = s.toUpperCase();

            for (let i = 0; i < s.length; i++)
                this.glyph(s[i], x + i * 6 * sc + sc, y + sc, shadow, sc);

            this.glyph(s[i], x + i * 6 * sc, y, c, sc);

    textC(s, cx, y, c, sc = 1, shadow = -1) { this.text(s, Math.round(cx - this.textW(s, sc) / 2), y, c, sc, shadow); }

    bigText(s, x, y, sc, top, bot, outline = P.ink, wave = 0, t = 0, glowS = 0) {
        s = s.toUpperCase();
        for (let pass = 0; pass < 3; pass++) {
            for (let i = 0; i < s.length; i++) {
                const g = GLYPHS[s[i]] || GLYPHS['?'];
                const ox = x + i * 6 * sc, oy = y + Math.round(Math.sin(t * 6 + i * 0.7) * wave);
                for (let r = 0; r < 7; r++) {
                    const row = g[r];
                    if (!row)
                        continue;
                    for (let b = 0; b < 5; b++)
                        if (row & (16 >> b)) {
                            const px = ox + b * sc, py = oy + r * sc;
                            if (pass === 0)
                                this.rect(px - 1 + 2, py - 1 + 2, sc + 2, sc + 2, P.void); // shadow
                            else if (pass === 1)
                                this.rect(px - 1, py - 1, sc + 2, sc + 2, outline); // outline

                                for (let yy = 0; yy < sc; yy++) {
                                    const tt = (r * sc + yy) / (7 * sc);
                                    const c = tt < 0.5 ? mix(top, shade(top, 1.15), 1 - tt * 2) : mix(top, bot, (tt - 0.5) * 2);
                                    this.rect(px, py + yy, sc, 1, c);
                                    if (glowS)
                                        for (let xx = 0; xx < sc; xx++) {
                                            const X = px + xx, Y = py + yy;
                                            if (X >= 0 && Y >= 0 && X < SW && Y < SH)

        this.bigText(s, Math.round(cx - this.textW(s, sc) / 2), y, sc, top, bot, outline, wave, t, glowS);

    // 1px cartoon outline around sprite-stacked objects (Earthworm-Jim ink line)
    outline(c) {
        const id = this.id, zb = this.zb, buf = this.buf, mark = this.scratch;
        let n = 0;
        for (let y = 1; y < SH - 1; y++) {
            for (let x = 1; x < SW - 1; x++) {
                const i = y * SW + x;
                if (id[i])
                    continue;
                const z = zb[i];
                if ((id[i - 1] && zb[i - 1] < z) || (id[i + 1] && zb[i + 1] < z) || (id[i - SW] && zb[i - SW] < z) || (id[i + SW] && zb[i + SW] < z))
                    mark[n++] = i;

        for (let k = 0; k < n; k++) {
            const i = mark[k];
            let best = FAR;
            if (id[i - 1] && zb[i - 1] < best)
                best = zb[i - 1];
            if (id[i + 1] && zb[i + 1] < best)
                best = zb[i + 1];
            if (id[i - SW] && zb[i - SW] < best)
                best = zb[i - SW];
            if (id[i + SW] && zb[i + SW] < best)
                best = zb[i + SW];

            zb[i] = best;

            for (let y = 0; y < hh; y++) {

function bossPre(e, dt, rest) {

        d.state = 'enter';
        d.pat = 0;
        d.patT = 2;
        d.hands = 0;

        d.cool = 0;

            shock(e.x, e.y, gh + 2, P.white, 50);

        d.dieT -= dt / Math.max(0.3, G.slowmo);

            shock(e.x + ox, e.y + oy, e.z + oz, P.gold, 24);
            AUDIO.sfx('kill');
            G.cam.shake(5);
        }
        if (d.dieT <= 0) {
            e.alive = false;

            G.cam.shake(14);
            G.whiteFlash = 1;
            const cz = e.z + e.h * 0.5;
            debris(e.x, e.y, cz, 60, [P.gold, P.wood, P.hkPale, P.neonCyan, P.ewjRed], 200);

function updateMap(g) {
    const inp = g.input;
    if (inp.p('ArrowRight', 'KeyD') || (inp.upPressed && !g.mapShop)) {
        if (g.mapSel < SAVE.unlocked && g.mapSel < 3) {
            g.mapSel++;
            AUDIO.sfx('blip');
        }
        g.mapShop = false;
    }
    if (inp.p('ArrowLeft', 'KeyA')) {
        if (g.mapSel > 0) {
            g.mapSel--;
            AUDIO.sfx('blip');
        }
        g.mapShop = false;
    }
    if (inp.downPressed) {
        g.mapShop = !g.mapShop;
        AUDIO.sfx('blip');
    }
    if (inp.upPressed && g.mapShop) {
        g.mapShop = false;
    }
    if (inp.p('KeyS')) {
        g.openShop();
        return;
    }
    let act = g.actPressed();
    if (inp.tap) {
        const [tx, ty] = inp.tap;
        act = false;
        if (tx > SW - 84 && ty > SH - 32) {
            g.openShop();
            return;
        }
        for (let k = 0; k < 4; k++)
            if (Math.hypot(tx - MAP_NODES[k][0], ty - MAP_NODES[k][1]) < 22 && k <= SAVE.unlocked) {
                if (g.mapSel === k)
                    act = true;
                g.mapSel = k;
                g.mapShop = false;
                AUDIO.sfx('blip');
            }
    }
    if (act) {
        if (g.mapShop)
            g.openShop();
        else if (g.mapSel <= SAVE.unlocked) {
            AUDIO.sfx('power');
            g.startStage(g.mapSel);
        }
    }
    if (inp.pausePressed)
        g.toTitle();
}

"use strict";
// ============================================================
//  UI: Earthworm Jim-style chunky HUD + portrait, Bionic Commando

GLYPHS['∞'] = [0, 0, 10, 21, 10, 0, 0];
// ---------- portraits (drawn in pixels) ----------
function drawNeilFace(R, x, y, mood, t, size = 1) {
    // mood: 0 happy .. 1 panicked
    const cx = x + 15 * size, cy = y + 16 * size, r = 11 * size;
    for (let yy = -r - 1; yy <= r + 1; yy++)
        for (let xx = -r - 1; xx <= r + 1; xx++) {
            const d = Math.hypot(xx / 1.08, yy);
            if (d > r + 1)
                continue;
            const fold = Math.sin(xx * 0.55 / size + Math.sin(yy * 0.5 / size) * 2.2) > 0.55;
            R.px(cx + xx, cy + yy, d > r ? P.ink : fold ? P.brainDk : (yy < -r * 0.4 ? P.brainLt : P.brain));
        }
    // dendrites
    for (let s = -1; s <= 1; s++) {
        for (let k = 0; k < 7 * size; k++)
            R.px(cx + s * 5 * size + Math.sin(k * 0.5 + t * 4 + s) * 1.5, cy - r - k, P.brainDk);
        R.circle(cx + s * 5 * size + Math.sin(7 * 0.5 + t * 4 + s) * 1.5, cy - r - 7 * size, 1.4 * size, s === 0 ? P.neonMag : P.neonCyan);
    }
    // eyes
    const look = Math.sin(t * 0.8) * 1.5 * size, wide = 1 + mood * 0.4;
    for (let e = -1; e <= 1; e += 2) {
        const ex = cx + e * 4.5 * size, ey = cy - 2 * size;
        R.circle(ex, ey, 3.6 * size * wide, P.ink);
        R.circle(ex, ey, 3 * size * wide, P.white);
        const pr = mood > 0.7 ? 0.8 : 1.4;
        R.circle(ex + look + (mood > 0.7 ? Math.sin(t * 30) : 0), ey + 0.5, pr * size, P.ink);
    }
    // mouth
    const my = cy + 5 * size;
    if (mood < 0.35) {
        for (let i = -4 * size; i <= 4 * size; i++)
            R.px(cx + i, my + Math.round((16 * size * size - i * i) / (12 * size)), P.ink);
        R.rect(cx - 2 * size, my + size, 4 * size, size, P.ewjRed);
    }
    else if (mood < 0.7)
        R.rect(cx - 3 * size, my + 1, 6 * size, size, P.ink);
    else {
        R.circle(cx, my + 2 * size, 2.5 * size, P.ink);
        R.circle(cx, my + 2.5 * size, 1.2 * size, P.ewjRed);
    }
    // sweat drop
    if (mood > 0.5)
        R.circle(cx + r - 2, cy - 6 + (t * 20 % 6), 1.5, P.neonCyan);
}
function drawPrincessFace(R, x, y, t) {
    const cx = x + 22, cy = y + 26;

    for (let yy = -12; yy <= 12; yy++)

            if (d <= 12)
                R.px(cx + xx, cy + yy, d > 11 ? P.ink : yy < -5 ? P.brainLt : P.brain);

function drawTimeFace(R, x, y, t) {

// ---------- word wrap ----------
function wrap(s, maxc) {
    const words = s.split(' '), lines = [];
    let cur = '';
    for (const w of words) {
        if ((cur + ' ' + w).trim().length > maxc) {
            lines.push(cur.trim());
            cur = w;
        }
        else
            cur += ' ' + w;
    }
    if (cur.trim())
        lines.push(cur.trim());
    return lines;
}

"use strict";
// ============================================================
//  Main: input, game states, level script, render pipeline, loop

class Input {
    constructor(canvas) {
        this.keys = new Set();

        this.ax = 0;
        this.ay = 0;
        this.fire = false;
        this.jump = false;
        this.jumpPressed = false;
        this.whipPressed = false;
        this.camPressed = false;
        this.pausePressed = false;
        this.startPressed = false;
        this.anyPressed = false;
        this.upPressed = false;
        this.downPressed = false;
        this.mutePressed = false;

        this.canvas = canvas;

            e.preventDefault(); if (!e.repeat)

        window.addEventListener('keyup', e => { this.keys.delete(e.code); });
        window.addEventListener('blur', () => this.keys.clear());

            e.preventDefault();
            AUDIO.init();
            const [x, y] = toLocal(e);
            this.tap = [x, y];
            if (e.pointerType === 'mouse') {
                this.pressed.add('Mouse');
                return;
            }
            this.touchActive = true;
            canvas.setPointerCapture(e.pointerId);

            let hit = '';
            for (const b of TOUCH_BTNS)
                if (Math.hypot(x - b.x, y - b.y) < b.r + 9)
                    hit = b.k;
            if (hit) {
                this.tptr.set(e.pointerId, hit);
                this.tbtn[hit] = true;
                this.tpressed.add(hit);
            }
            else if (x < SW * 0.55 && this.stick.id === null) {

        } });

    p(...codes) { return codes.some(c => this.pressed.has(c)); }

        let ax = (this.k('ArrowRight', 'KeyD') ? 1 : 0) - (this.k('ArrowLeft', 'KeyA') ? 1 : 0);
        let ay = (this.k('ArrowDown', 'KeyS') ? 1 : 0) - (this.k('ArrowUp', 'KeyW') ? 1 : 0);
        let fire = this.k('KeyJ', 'KeyX'), jump = this.k('KeyK', 'Space', 'KeyZ');
        let jp = this.p('KeyK', 'Space', 'KeyZ'), wp = this.p('KeyL', 'KeyV'), cp = this.p('KeyC', 'Tab'), pp = this.p('KeyP', 'Escape');
        let sp = this.p('Enter', 'NumpadEnter'), up = this.p('ArrowUp', 'KeyW'), dn = this.p('ArrowDown', 'KeyS');
        this.directCam = this.p('Digit1') ? 0 : this.p('Digit2') ? 1 : this.p('Digit3') ? 2 : this.p('Digit4') ? 3 : -1;
        // touch
        if (this.stick.id !== null) {
            let dx = (this.stick.x - this.stick.ox) / 22, dy = (this.stick.y - this.stick.oy) / 22;

                ay = dy;

        if (this.tbtn.jump)

        if (this.tpressed.has('whip'))
            wp = true;
        if (this.tpressed.has('cam'))

                ax = -1;
            if (b(15))

            if (b(12))

            if (b(13))

            if (bp(0))

            if (bp(3))

            if (bp(13))

                drawClear(R, this);
            if (this.state === 'play' || this.state === 'dialog')
                drawTouch(R, this);
        }
        R.present();
    }
    renderWorld() {
        const R = this.R, cam = this.cam, pl = this.player, t = this.t;
        R.begin();
        const camDist = Math.exp(cam.ldist);
        FOG_C = zoneColor(cam.tx, 'fog');
        FOG_NEAR = camDist + 60 + cam.thirdness * 60;
        FOG_FAR = camDist + 380 + cam.thirdness * 200;
        drawSky(R, cam, cam.tx, t);
        drawTerrain(R, cam, t);
        // props
        const third = cam.thirdness, xmin = cam.tx - 280, xmax = cam.tx + 280 + third * 300;
        for (const p of PROPS) {
            if (p.x < xmin || p.x > xmax)
                continue;
            if (cam.depth(p.x, p.y, p.z) < 45)
                continue;
            drawStack(R, cam, p.m, p.x, p.y, p.z, p.yaw + (p.m === MODELS.lamp[0] ? 0 : 0), p.vs, { id: p.id });
        }
        // entities
        for (const e of this.enemies)
            if (e.x > xmin - 40 && e.x < xmax + 40)
                e.draw(R, cam);
        if ((this.arenaLock && this.stage === 3) || this.state === 'win' || this.state === 'credits')
            this.princess.draw(R, cam);
        pl.draw(R, cam);
        R.outline(P.ink);
        drawPickups(R, cam);
        drawBullets(R, cam);
        drawParticles(R, cam);
        // ambient floating neurotransmitter motes
        const zcol = ZONES[zoneIndexAt(cam.tx)].win;
        for (let i = 0; i < this.motes.length; i++) {
            const m = this.motes[i];
            const mx = cam.tx + ((m[0] + t * 8 + 300) % 600 + 600) % 600 - 300, my = m[1], mz = groundH(mx, my) + m[2] + Math.sin(t + m[3]) * 6;
            if (cam.project(mx, my, mz, _pp))
                R.discZ(_pp.x, _pp.y, _pp.z, Math.max(0.5, 0.5 * _pp.s), zcol[i % zcol.length], 0.8);
        }
        R.bloom(1.05);
        // popups (comic words)
        for (const p of this.popups) {
            if (!cam.project(p.x, p.y, p.z, _pp))
                continue;
            const sc = p.big && p.text.length <= 9 ? 2 : 1, a = Math.min(1, p.life * 4), pop = p.life > p.life ? 1 : 1;
            void a;
            void pop;
            R.bigTextC(p.text, _pp.x, _pp.y - 8, sc, p.c, p.c2, P.ink);
        }
        // screen fx
        const tr = Math.max(this.trip, 0);
        if (tr > 0.02)
            R.trip(tr, t);
        if (this.woozy > 0)
            R.trip(Math.min(0.35, this.woozy * 0.15), t * 0.7);
        if (this.hurtFlash > 0) {
            R.chroma(this.hurtFlash * 6);
            R.rectD(0, 0, SW, SH, P.ewjRed, this.hurtFlash * 0.35);
        }
        if (this.whiteFlash > 0)
            R.rectD(0, 0, SW, SH, P.white, this.whiteFlash);
        // low sanity vignette pulse
        if (pl.alive && pl.sanity < 30 && this.state === 'play') {
            const k = (Math.sin(t * 6) * 0.5 + 0.5) * 0.4;
            for (let y = 0; y < SH; y++)
                for (let x = 0; x < SW; x += 1) {
                    const d = Math.hypot((x - SW / 2) / SW, (y - SH / 2) / SH);
                    if (d > 0.42 && BAYER[(y & 3) * 4 + (x & 3)] < (d - 0.42) * 4 * k)
                        R.buf[y * SW + x] = P.ewjRed;
                }
        }
    }
}
// ---------------- boot ----------------
let G;
function boot() {
    buildTextures();
    buildHeightGrid();
    buildAllModels();
    buildProps();
    const canvas = document.getElementById('screen');
    G = new Game(canvas);
    const fit = () => {
        const w = window.innerWidth, h = window.innerHeight;
        let s = Math.min(w / SW, h / SH);
        if (s >= 2)
            s = Math.floor(s * 2) / 2;
        canvas.style.width = Math.floor(SW * s) + 'px';
        canvas.style.height = Math.floor(SH * s) + 'px';
    };
    window.addEventListener('resize', fit);
    fit();
    let last = performance.now(), acc = 0;
    const STEP = 1 / 60;
    let fpsT = 0, fpsN = 0;
    const frame = (now) => {
        let dt = (now - last) / 1000;
        last = now;
        if (dt > 0.1)
            dt = 0.1;
        acc += dt;
        let n = 0;
        while (acc >= STEP && n < 5) {
            G.step(STEP);
            acc -= STEP;
            n++;
        }
        G.render();
        fpsT += dt;
        fpsN++;
        if (fpsT > 1) {
            window.__fps = fpsN / fpsT;
            fpsT = 0;
            fpsN = 0;
        }
        requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
    window.__G = G;
}
window.addEventListener('load', boot);

</script>
