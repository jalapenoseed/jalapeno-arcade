            c.tx = hx + (c.tx - hx) * k;
            c.ty = hy + (c.ty - hy) * k;
            c.tz = hz + (c.tz - hz) * k;
            c.compute();

        const t = w.rayBuildings(c.tx, c.ty, c.tz, c.ex, c.ey, c.ez);

            c.shorten(Math.max(2.2, c.dist * t * 0.9));
